name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Formatting, lint, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo package --locked
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-package-target
      - run: cargo build --locked --profile dist
      - name: Install dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      - name: Verify release configuration
        shell: bash
        run: |
          dist generate --check
          dist plan --output-format=json > "$RUNNER_TEMP/dist-plan.json"
          jq -e '
            (.artifacts | has("lemmaspec-installer.sh")) and
            (.artifacts | has("lemmaspec-installer.ps1")) and
            (.artifacts | has("lemmaspec.rb"))
          ' "$RUNNER_TEMP/dist-plan.json"
      - name: Verify agent distribution
        shell: bash
        run: |
          jq -e . .agents/plugins/marketplace.json > /dev/null
          jq -e . .claude-plugin/marketplace.json > /dev/null
          jq -e . plugins/lemmaspec/.claude-plugin/plugin.json > /dev/null
          jq -e . plugins/lemmaspec/.codex-plugin/plugin.json > /dev/null

          test -f plugins/lemmaspec/skills/lemmaspec/SKILL.md
          test -f plugins/lemmaspec/skills/lemmaspec/agents/openai.yaml

          package_version="$(cargo metadata --locked --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "lemmaspec") | .version')"
          test "$(jq -r .version plugins/lemmaspec/.claude-plugin/plugin.json)" = "$package_version"
          test "$(jq -r .version plugins/lemmaspec/.codex-plugin/plugin.json)" = "$package_version"

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --all-targets

  intent:
    name: Intent catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Record examples and report verified statements
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          cargo run -q -p lemmaspec-intent --locked -- record --ledger "$RUNNER_TEMP/runs.intent"

          base_args=()
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]]; then
            base_args=(--base "$BASE")
          fi
          status=0
          cargo run -q -p lemmaspec-intent --locked -- report --ledger "$RUNNER_TEMP/runs.intent" "${base_args[@]}" -o "$RUNNER_TEMP/intent.md" || status=$?
          if [[ -f "$RUNNER_TEMP/intent.md" ]]; then
            cat "$RUNNER_TEMP/intent.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
